name: Daily Investment Analysis

on:
  workflow_dispatch:

  schedule:
    # 22:00 UTC = 다음날 07:00 KST
    # 미국장 마감 후 한국시간 아침에 실행
    - cron: "0 22 * * 1-5"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Korean font for matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quantitative analysis
        env:
          TICKER: SOXX
          BENCHMARK: VOO
          SAVE_CHARTS: "false"
        run: |
          python main.py > analysis_result.txt 2>&1

      - name: Print analysis result to Actions log
        run: |
          cat analysis_result.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Daily Quant] SOXX Investment Analysis"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: file://analysis_result.txt
